[package]
name = "myleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "an interactive and personalized leetcode experience"
repository = "https://github.com/kidskoding/myleet"
publish = false

[[bin]]
name = "myleet-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
