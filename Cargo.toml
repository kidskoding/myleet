[package]
name = "myleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "an interactive and personalized leetcode experience"
repository = "https://github.com/kidskoding/myleet"
publish = false

[[bin]]
name = "myleet-rs"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
htmd = "0.5.6"
jiff = "0.2.44"
notify = "8.2.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tempfile = "3.27.0"
toml = "1.2.1"
ureq = "3.5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
