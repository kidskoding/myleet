[package]
name = "myleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "an interactive and personalized leetcode experience"
repository = "https://github.com/kidskoding/myleet"
publish = false

[[bin]]
name = "myleet-rs"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
getrandom = "0.4.3"
jiff = "0.2.44"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
unicode-width = "0.2.3"
