[workspace]
members = [".", "crates/core"]
# The Cloudflare Worker builds on its own toolchain and target.
exclude = ["worker"]

[workspace.dependencies]
getrandom = "0.4.3"
jiff = "0.2.44"
myleet-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[package]
name = "myleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "an interactive and personalized leetcode experience"
repository = "https://github.com/kidskoding/myleet"
publish = false

[[bin]]
name = "myleet"
path = "src/main.rs"

[dependencies]
htmd = "0.5.6"
jiff.workspace = true
myleet-core.workspace = true
roxmltree = "0.21.2"
serde.workspace = true
serde_json.workspace = true
similar = "3.2.1"
tempfile = "3.27.0"
toml.workspace = true
ureq = "3.5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
