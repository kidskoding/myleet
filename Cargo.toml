[package]
name = "myleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "an interactive and personalized leetcode experience"
repository = "https://github.com/kidskoding/myleet"
publish = false

[[bin]]
name = "myleet-rs"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
jiff = "0.2.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
