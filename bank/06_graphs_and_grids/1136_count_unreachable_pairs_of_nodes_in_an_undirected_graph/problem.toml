key_idea = "Find connected component sizes (union-find or DFS); each component of size s pairs with every node seen in earlier components, so add s * (nodes so far) as you go."
hints = ["Two nodes are unreachable exactly when they are in different components.", "Avoid comparing every pair of components; a running total of nodes seen so far is enough."]
