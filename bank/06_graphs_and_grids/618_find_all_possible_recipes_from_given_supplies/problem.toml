key_idea = "Topological sort (Kahn): each recipe waits on its missing ingredients; start a queue from the supplies and release a recipe when its last ingredient becomes available."
hints = ["A recipe can become an ingredient of another recipe, so think of dependencies as a graph.", "Recipes caught in a cycle can never be made; a BFS that only releases fully satisfied nodes handles that."]
