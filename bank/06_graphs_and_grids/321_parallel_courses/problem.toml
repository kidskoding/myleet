id = "parallel-courses"
title = "Parallel Courses"
difficulty = "medium"
leetcode = 1136
url = "https://leetcode.com/problems/parallel-courses/"
key_idea = "Kahn's topological sort level by level: each BFS layer of zero-indegree courses is one semester; if not every course is taken, there is a cycle."
hints = ["In the first semester you can take every course with no prerequisites. What changes after you take them?", "Run Kahn's algorithm one whole layer at a time and count layers; if fewer than n courses were ever taken, return -1."]
prompt = """
Write `minimum_semesters(n, relations)`. There are `n` courses labeled `1` to `n`. Each pair
`[prev_course, next_course]` in `relations` means `prev_course` must be finished in an earlier
semester than `next_course`.

In one semester you may take any number of courses, as long as every prerequisite of each was
finished in a previous semester. Return the minimum number of semesters needed to take all
courses, or `-1` if it cannot be done.

**Example 1:**

```
Input: n = 3, relations = [[1,3],[2,3]]
Output: 2
```

Take courses 1 and 2 in the first semester and course 3 in the second.

**Example 2:**

```
Input: n = 3, relations = [[1,2],[2,3],[3,1]]
Output: -1
```

Every course waits on another, so none can be started.

**Example 3:**

```
Input: n = 5, relations = [[1,2],[2,3],[3,4],[1,5]]
Output: 4
```

**Constraints:**

- `1 <= n <= 5000`
- `0 <= len(relations) <= 5000`
- `1 <= prev_course, next_course <= n`, `prev_course != next_course`
- All pairs are distinct
"""
