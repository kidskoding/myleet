id = "longest-cycle-in-a-graph"
title = "Longest Cycle in a Graph"
difficulty = "hard"
leetcode = 2360
url = "https://leetcode.com/problems/longest-cycle-in-a-graph/"
key_idea = "Each node has one out-edge, so walk from every unvisited node recording the step at which each node is reached in this walk; hitting a node from the current walk closes a cycle of length step difference."
hints = ["With at most one outgoing edge per node, following edges from a start traces a single path. How can that path end?", "Remember when (in steps) you reached each node on the current walk, and never re-walk nodes finished by earlier walks."]
