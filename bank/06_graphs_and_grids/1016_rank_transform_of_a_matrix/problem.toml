key_idea = "Process values in increasing order; union equal cells sharing a row or column, give each group 1 + max current rank of its rows and columns, then record it for those rows and columns."
hints = ["Smaller values never depend on larger ones, so handle values from smallest up.", "Equal values linked through shared rows or columns must all get the same rank."]
