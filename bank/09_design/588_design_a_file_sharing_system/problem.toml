id = "design-a-file-sharing-system"
title = "Design a File Sharing System"
difficulty = "medium"
leetcode = 1500
url = "https://leetcode.com/problems/design-a-file-sharing-system/"
key_idea = "A min-heap of freed IDs plus a next-ID counter hands out the smallest free ID, and chunk -> users and user -> chunks maps make leave and request direct lookups."
hints = ["Handing out the smallest free ID is a priority-queue problem once IDs can be returned.", "Keep both directions of the ownership relation so that a leave can clean up every chunk the user held."]
prompt = """
Implement a `FileSharing` class for a peer-to-peer service that shares one file split
into `m` chunks, numbered `1` to `m`.

- `FileSharing(m)` sets up the service for a file with `m` chunks. There are no users yet.
- `join(owned_chunks)` registers a new user who already holds the chunks listed in
  `owned_chunks` and returns their ID: the smallest positive integer that no current user
  has. IDs of users who left can be handed out again.
- `leave(user_id)` removes that user. The chunks they held go with them, and their ID
  becomes free.
- `request(user_id, chunk_id)` returns the IDs of every current user who holds chunk
  `chunk_id`, in ascending order (the requester is included if they already hold it).
  If that list is not empty, the requester now holds the chunk too.

**Example 1:**

```
Input:  FileSharing(4); join([1,2]); join([2,3]); join([4]); request(1,3);
        request(2,2); leave(1); request(2,1); leave(2); join([])
Output: join -> 1, join -> 2, join -> 3, request(1,3) -> [2], request(2,2) -> [1,2],
        request(2,1) -> [], join([]) -> 1
```

User 1 gets chunk 3 from user 2. After user 1 leaves, nobody holds chunk 1. Once users
1 and 2 have both left, ID 1 is the smallest free ID again.

**Example 2:**

```
Input:  FileSharing(3); join([]); join([]); join([]); leave(3); leave(1); join([]); join([])
Output: join -> 1, join -> 2, join -> 3, join -> 1, join -> 3
```

**Constraints:**

- `1 <= m <= 10^5`
- `0 <= len(owned_chunks) <= min(100, m)`; its values are distinct and in `[1, m]`
- `1 <= chunk_id <= m`
- Every `user_id` passed to `leave` or `request` belongs to a current user
- At most `10^4` calls in total
"""
