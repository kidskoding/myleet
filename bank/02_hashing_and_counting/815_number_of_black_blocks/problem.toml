key_idea = "Each black cell touches at most four 2x2 blocks; count black cells per block top-left corner in a hash map, then all blocks not in the map have zero black cells."
hints = ["The grid is huge but black cells are few, so only look at blocks near black cells.", "A cell belongs to the blocks whose top-left corner is the cell itself or one step up and/or left."]
