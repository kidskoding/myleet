id = "group-shifted-strings"
title = "Group Shifted Strings"
difficulty = "medium"
leetcode = 249
url = "https://leetcode.com/problems/group-shifted-strings/"
key_idea = "Key each string by the tuple of differences between consecutive letters mod 26 (equivalently, shift it so it starts with 'a'), and bucket strings by that key in a hash map."
hints = ["Shifting changes every letter by the same amount; what stays the same?", "Find a canonical form that every member of a shifting sequence maps to."]
prompt = """
Implement `group_strings(strings)`.

Shifting a string moves every letter to the next letter of the alphabet, with `'z'` wrapping
around to `'a'`. For example, `"abc"` shifts to `"bcd"`, and `"xyz"` shifts to `"yza"`.
Repeated shifting produces a shifting sequence such as `"abc" -> "bcd" -> ... -> "xyz"`.

Group together all strings in `strings` that belong to the same shifting sequence, that is,
strings where one can be shifted some number of times to become the other. Return the
groups in any order, with the strings inside each group in any order.

**Example 1:**

```
Input: strings = ["abc","bcd","acef","xyz","az","ba","a","z"]
Output: [["acef"],["a","z"],["abc","bcd","xyz"],["az","ba"]]
```

Shifting `"az"` once gives `"ba"`, so the two share a group. Single letters can always be
shifted into each other.

**Example 2:**

```
Input: strings = ["a"]
Output: [["a"]]
```

**Constraints:**

- `1 <= strings.length <= 200`
- `1 <= strings[i].length <= 50`
- `strings[i]` consists of lowercase English letters
"""
