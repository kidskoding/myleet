id = "diameter-of-n-ary-tree"
title = "Diameter of N-Ary Tree"
difficulty = "medium"
leetcode = 1522
url = "https://leetcode.com/problems/diameter-of-n-ary-tree/"
key_idea = "Post-order DFS returning height; at each node the best path through it is the sum of its two tallest child heights."
hints = ["The longest path bends at exactly one highest node. What does that node need from its children?", "Have DFS return each subtree's height and, at every node, combine the two largest child heights (plus one edge each) into a candidate diameter."]
prompt = """
Write `diameter(root)`. Each `Node` of an N-ary tree has an integer `val` and a list
`children` of any length. Return the diameter of the tree: the number of edges on the
longest path between any two nodes. The path does not have to pass through the root.
Return `0` for an empty tree.

**Example 1:**

```
Input: root = 1 with children [2, 3, 4], all leaves
Output: 2
```

The longest path is `2 -> 1 -> 3`.

**Example 2:**

```
Input: root = 1 -> 2; node 2 has children 3 and 4; 3 -> 5; 4 -> 6 -> 7
Output: 5
```

The longest path is `5 -> 3 -> 2 -> 4 -> 6 -> 7`, which never touches the root.

**Constraints:**

- The number of nodes is in the range `[0, 10^4]`
- The depth of the tree is at most `1000`
"""
