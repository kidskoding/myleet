id = "boundary-of-binary-tree"
title = "Boundary of Binary Tree"
difficulty = "medium"
leetcode = 545
url = "https://leetcode.com/problems/boundary-of-binary-tree/"
key_idea = "Concatenate root, the left edge minus its leaf, all leaves left to right, and the right edge minus its leaf in reverse."
hints = ["Split the answer into four separate pieces and build each one on its own.", "Walk the left edge preferring left children, collect leaves with a DFS, walk the right edge preferring right children and reverse it."]
prompt = """
Implement `boundary_of_binary_tree(root)`, which returns the values on the outline of a
binary tree, read counter-clockwise starting from the root. Return an empty list for an
empty tree.

The outline is the concatenation of four parts, with no node listed twice:

- The root.
- The *left edge*: start at the root's left child (the edge is empty if there is none).
  From each node, step to its left child if it has one, otherwise to its right child.
  Stop before reaching a leaf; the leaf itself is not part of the edge.
- Every leaf of the tree, ordered left to right. The root is never counted as a leaf.
- The *right edge*, defined the same way but starting at the root's right child and
  preferring right children, listed in reverse (bottom to top).

**Example 1:**

```
Input: root = [1,null,2,3,4]
Output: [1,3,4,2]
```

The root has no left child, so the left edge is empty. The leaves are `3` and `4`, and
the right edge is just `2`.

**Example 2:**

```
Input: root = [1,2,3,4,5,6,null,null,null,7,8,9,10]
Output: [1,2,4,7,8,9,10,6,3]
```

**Example 3:**

```
Input: root = [1,2,null,3,null,4]
Output: [1,2,3,4]
```

**Constraints:**

- The number of nodes is in the range `[0, 10^4]`
- `-1000 <= Node.val <= 1000`
"""
