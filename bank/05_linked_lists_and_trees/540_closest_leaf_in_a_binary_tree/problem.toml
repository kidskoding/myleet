id = "closest-leaf-in-a-binary-tree"
title = "Closest Leaf in a Binary Tree"
difficulty = "medium"
leetcode = 742
url = "https://leetcode.com/problems/closest-leaf-in-a-binary-tree/"
key_idea = "Record parent pointers, then BFS outward from the node with value k over child and parent edges; the first leaf dequeued is the closest."
hints = ["The nearest leaf might be reached by going up first.", "Treat the tree as an undirected graph and search outward from k level by level."]
prompt = """
Implement `find_closest_leaf(root, k)`. Every node in the binary tree has a distinct value,
and some node has value `k`. Return the value of the leaf closest to that node, where
distance is the number of edges on the path between them and a leaf is a node with no
children. If several leaves are equally close, return any of them.

**Example 1:**

```
Input: root = [1,3,2], k = 1
Output: 2
```

Leaves `2` and `3` are both one edge away; either is accepted.

**Example 2:**

```
Input: root = [1], k = 1
Output: 1
```

The root is itself a leaf.

**Example 3:**

```
Input: root = [1,2,3,4,null,null,null,5,null,6], k = 2
Output: 3
```

Going up through the root reaches leaf `3` in two edges, closer than leaf `6` below.

**Constraints:**

- The number of nodes is in the range `[1, 1000]`
- `1 <= Node.val <= 1000`
- All values are distinct, and a node with value `k` exists
"""
