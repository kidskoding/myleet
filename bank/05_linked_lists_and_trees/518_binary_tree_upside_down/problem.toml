id = "binary-tree-upside-down"
title = "Binary Tree Upside Down"
difficulty = "medium"
leetcode = 156
url = "https://leetcode.com/problems/binary-tree-upside-down/"
key_idea = "Walk down the left spine like reversing a linked list: each node's left becomes its old right sibling and its right becomes its old parent; the bottom-left node is the new root."
hints = ["Draw the transformation for three nodes, then for five.", "Only the leftmost path changes shape; carry the previous node and the previous right child as you walk down it."]
prompt = """
Implement `upside_down_binary_tree(root)`. Every right node in the tree has a left sibling
(a left node with the same parent) and has no children of its own. Turn the tree upside
down and return the new root, using these rules one level at a time:

- The original left child becomes the new root.
- The original root becomes the new right child.
- The original right child becomes the new left child.

**Example 1:**

```
Input: root = [1,2,3,4,5]
Output: [4,5,2,null,null,3,1]
```

**Example 2:**

```
Input: root = []
Output: []
```

**Example 3:**

```
Input: root = [1]
Output: [1]
```

**Constraints:**

- The number of nodes is in the range `[0, 10]`
- `1 <= Node.val <= 10`
- Every right node has a sibling and has no children
"""
