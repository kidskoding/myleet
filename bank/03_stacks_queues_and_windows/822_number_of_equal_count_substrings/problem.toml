id = "number-of-equal-count-substrings"
title = "Number of Equal Count Substrings"
difficulty = "medium"
leetcode = 2067
url = "https://leetcode.com/problems/number-of-equal-count-substrings/"
key_idea = "For each possible number u of distinct letters (1..26) slide a fixed window of length u * count and check how many letters appear exactly count times."
hints = ["If a valid substring has u distinct letters, its length is fixed.", "Try each u separately with a window of that exact length."]
prompt = """
Implement `equal_count_substrings(s, count)`.

A substring of `s` is an **equal count substring** when every letter that appears in it
appears exactly `count` times. Return how many substrings of `s` (counted by position) are
equal count substrings.

**Example 1:**

```
Input: s = "aaabcbbcc", count = 3
Output: 3
```

"aaa" (indices 0..2), "bcbbcc" (indices 3..8) and "aaabcbbcc" (the whole string) qualify.

**Example 2:**

```
Input: s = "abcd", count = 2
Output: 0
```

Every letter appears once, so nothing reaches two of a letter.

**Example 3:**

```
Input: s = "a", count = 5
Output: 0
```

**Constraints:**

- `1 <= s.length <= 3 * 10^4`
- `1 <= count <= 3 * 10^4`
- `s` consists of lowercase English letters
"""
