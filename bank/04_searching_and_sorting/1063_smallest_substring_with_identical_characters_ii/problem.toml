key_idea = "Binary search the answer L; for L >= 2 a run of length r needs r // (L + 1) flips, and L = 1 needs the cheaper of the two alternating patterns."
hints = ["If a longest run of L is achievable, so is any larger limit; that monotonicity invites binary search.", "For a fixed limit, count the flips run by run, but treat a limit of 1 separately since flips there can merge with neighbours."]
