key_idea = "Build a trie of the folders, serialize each non-leaf subtree canonically (children sorted), count serializations, then skip every node whose serialization appears twice or more when listing paths."
hints = ["Identical folders have identical subtree shapes, so give each subtree a canonical string.", "Serialize bottom-up with children in sorted order, count the strings in a hash map, and do a second pass that skips duplicated subtrees."]
