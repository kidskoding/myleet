id = "minimum-operations-to-make-numbers-non-positive"
title = "Minimum Operations to Make Numbers Non-positive"
difficulty = "hard"
leetcode = 2702
url = "https://leetcode.com/problems/minimum-operations-to-make-numbers-non-positive/"
key_idea = "Binary search the number of operations t: every element loses t * y for free, and each still-positive element needs ceil(remaining / (x - y)) extra targeted operations; t works when those fit in t."
hints = ["If you knew the total number of operations, how much does every element drop no matter what?", "Feasibility is monotonic in the number of operations, so search for the smallest feasible count."]
prompt = """
Implement `min_operations(nums, x, y)`. You are given an array `nums` of positive integers
and two integers `x` and `y` with `x > y`.

One operation picks a single index `i`. The value at `i` is reduced by `x`, and every other
value in the array is reduced by `y`.

Return the smallest number of operations after which every value in `nums` is less than or
equal to zero.

**Example 1:**

```
Input: nums = [3,4,1,7,6], x = 4, y = 2
Output: 3
```

Pick index 3 (array becomes `[1,2,-1,3,4]`), then index 3 again (`[-1,0,-3,-1,2]`), then
index 4 (`[-3,-2,-5,-3,-2]`).

**Example 2:**

```
Input: nums = [1,2,1], x = 2, y = 1
Output: 1
```

Picking index 1 once gives `[0,0,0]`.

**Constraints:**

- `1 <= nums.length <= 10^5`
- `1 <= nums[i] <= 10^9`
- `1 <= y < x <= 10^9`
"""
