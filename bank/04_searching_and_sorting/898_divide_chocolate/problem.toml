id = "divide-chocolate"
title = "Divide Chocolate"
difficulty = "hard"
leetcode = 1231
url = "https://leetcode.com/problems/divide-chocolate/"
key_idea = "Binary search on the answer x: greedily cut a piece whenever the running sum reaches x; x is achievable iff that yields at least k + 1 pieces."
hints = ["If you can guarantee your piece has sweetness at least x, you can also guarantee anything smaller.", "For a fixed target, cutting as early as possible maximizes the number of pieces."]
prompt = """
Implement `maximize_sweetness(sweetness, k)`, which decides how to cut a chocolate bar to
get the best possible piece for yourself.

The bar is a row of chunks; chunk `i` has sweetness `sweetness[i]`. You make exactly `k`
cuts between chunks, splitting the bar into `k + 1` pieces of consecutive chunks. You
share the pieces with `k` friends, and being generous, you keep the piece with the
smallest total sweetness. Return the largest total sweetness your piece can have if you
choose the cuts optimally.

**Example 1:**

```
Input: sweetness = [1,2,3,4,5,6,7,8,9], k = 5
Output: 6
```

One optimal split is `[1,2,3], [4,5], [6], [7], [8], [9]`.

**Example 2:**

```
Input: sweetness = [5,6,7,8,9,1,2,3,4], k = 8
Output: 1
```

Every chunk becomes its own piece, so you get the chunk with sweetness `1`.

**Example 3:**

```
Input: sweetness = [1,2,2,1,2,2,1,2,2], k = 2
Output: 5
```

Split into `[1,2,2], [1,2,2], [1,2,2]`.

**Constraints:**

- `0 <= k < sweetness.length <= 10^4`
- `1 <= sweetness[i] <= 10^5`
"""
