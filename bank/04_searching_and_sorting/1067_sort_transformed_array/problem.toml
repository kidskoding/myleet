id = "sort-transformed-array"
title = "Sort Transformed Array"
difficulty = "medium"
leetcode = 360
url = "https://leetcode.com/problems/sort-transformed-array/"
key_idea = "A quadratic over sorted inputs is largest (a >= 0) or smallest (a < 0) at the ends, so two pointers from both ends fill the output from the back or the front."
hints = ["Think about the shape of the parabola: where on a sorted input do its extreme values sit?", "Compare f at the two ends and place the winner at the correct end of the output."]
prompt = """
Implement `sort_transformed_array(nums, a, b, c)`. `nums` is sorted in non-decreasing order.
Apply `f(x) = a * x^2 + b * x + c` to every element and return the results sorted in
non-decreasing order.

Aim for `O(n)` time.

**Example 1:**

```
Input: nums = [-4,-2,2,4], a = 1, b = 3, c = 5
Output: [3,9,15,33]
```

**Example 2:**

```
Input: nums = [-4,-2,2,4], a = -1, b = 3, c = 5
Output: [-23,-5,1,7]
```

**Constraints:**

- `1 <= nums.length <= 200`
- `-100 <= nums[i], a, b, c <= 100`
- `nums` is sorted in non-decreasing order
"""
