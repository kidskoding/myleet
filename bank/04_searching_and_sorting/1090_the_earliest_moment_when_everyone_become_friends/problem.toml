id = "the-earliest-moment-when-everyone-become-friends"
title = "The Earliest Moment When Everyone Become Friends"
difficulty = "medium"
leetcode = 1101
url = "https://leetcode.com/problems/the-earliest-moment-when-everyone-become-friends/"
key_idea = "Sort logs by time and union the two people of each log in a disjoint-set; the first time the component count reaches 1 is the answer."
hints = ["Process friendships in chronological order.", "Track how many separate groups remain as you merge them."]
prompt = """
Implement `earliest_acq(logs, n)`.

There are `n` people labeled `0` to `n - 1`. Each entry `logs[i] = [timestamp, x, y]` says
that `x` and `y` became friends at time `timestamp`. Friendship goes both ways.
Acquaintance spreads: `a` is acquainted with `b` if they are friends, or if `a` is friends
with someone who is acquainted with `b`.

Return the earliest timestamp at which every person is acquainted with every other person,
or `-1` if that never happens. The logs are not necessarily sorted.

**Example 1:**

```
Input: logs = [[20190101,0,1],[20190104,3,4],[20190107,2,3],[20190211,1,5],
               [20190224,2,4],[20190301,0,3],[20190312,1,2],[20190322,4,5]], n = 6
Output: 20190301
```

Before `20190301` there are two groups, `{0, 1, 5}` and `{2, 3, 4}`; the friendship of `0`
and `3` joins them.

**Example 2:**

```
Input: logs = [[0,2,0],[1,0,1],[3,0,3],[4,1,2],[7,3,1]], n = 4
Output: 3
```

**Constraints:**

- `2 <= n <= 100`
- `1 <= logs.length <= 10^4`
- `logs[i].length == 3`
- `0 <= timestamp <= 10^9`
- `0 <= x, y <= n - 1`, `x != y`
- All timestamps are distinct, and each pair of people appears at most once
"""
