id = "brightest-position-on-street"
title = "Brightest Position on Street"
difficulty = "medium"
leetcode = 2021
url = "https://leetcode.com/problems/brightest-position-on-street/"
key_idea = "Line sweep: +1 at position - range and -1 just after position + range, then walk the sorted event points keeping a running brightness and the first point where it peaks."
hints = ["Each lamp lights a closed interval; the brightness only changes at interval endpoints.", "Record where each interval starts and where it stops counting, then sweep in sorted order."]
prompt = """
Implement `brightest_position(lights)`. The street is a number line, and
`lights[i] = [position, range]` is a lamp that lights every point in the closed interval
`[position - range, position + range]`. The brightness of a point is the number of lamps
that light it.

Return the brightest point on the street. If several points tie, return the smallest one.

**Example 1:**

```
Input: lights = [[-3,2],[1,2],[3,3]]
Output: -1
```

The lamps cover `[-5,-1]`, `[-1,3]` and `[0,6]`. Points `-1` and every point in `[0,3]`
have brightness 2, and `-1` is the smallest of them.

**Example 2:**

```
Input: lights = [[1,0],[0,1]]
Output: 1
```

**Example 3:**

```
Input: lights = [[1,2]]
Output: -1
```

**Constraints:**

- `1 <= len(lights) <= 10^5`
- `-10^8 <= position <= 10^8`
- `0 <= range <= 10^8`
"""
