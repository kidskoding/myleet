id = "count-substrings-with-only-one-distinct-letter"
title = "Count Substrings with Only One Distinct Letter"
difficulty = "easy"
leetcode = 1180
url = "https://leetcode.com/problems/count-substrings-with-only-one-distinct-letter/"
key_idea = "Split s into maximal runs of equal letters; a run of length L contains L * (L + 1) / 2 single-letter substrings."
hints = ["A valid substring never crosses a boundary between different letters.", "Count how many valid substrings end at each index."]
prompt = """
Implement `count_letters(s)`, which returns the number of non-empty substrings of `s`
whose characters are all the same letter. Substrings at different positions count
separately even if they are equal.

**Example 1:**

```
Input: s = "aaaba"
Output: 8
```

`"aaa"` contributes `"a"` three times, `"aa"` twice and `"aaa"` once (6 total); `"b"` and
the final `"a"` add one each.

**Example 2:**

```
Input: s = "aaaaaaaaaa"
Output: 55
```

**Constraints:**

- `1 <= s.length <= 1000`
- `s` consists of lowercase English letters
"""
