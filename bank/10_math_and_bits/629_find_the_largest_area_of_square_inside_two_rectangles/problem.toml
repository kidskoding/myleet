key_idea = "For every pair of rectangles, the intersection has width min(right) - max(left) and height min(top) - max(bottom); the biggest square inside has side min(width, height), and the answer is the best side squared."
hints = ["The region where two axis-aligned rectangles overlap is itself a rectangle.", "A square inside a rectangle is limited by the shorter side."]
