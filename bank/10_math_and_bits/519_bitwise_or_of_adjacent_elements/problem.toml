id = "bitwise-or-of-adjacent-elements"
title = "Bitwise OR of Adjacent Elements"
difficulty = "easy"
leetcode = 3173
url = "https://leetcode.com/problems/bitwise-or-of-adjacent-elements/"
key_idea = "Pair each element with its right neighbor and OR them, producing n - 1 values."
hints = ["The output is one shorter than the input.", "zip the list with itself shifted by one."]
prompt = """
Implement `or_array(nums)`. Given a list of `n` non-negative integers, return a list of
length `n - 1` whose `i`-th value is the bitwise OR of `nums[i]` and `nums[i + 1]`.

**Example 1:**

```
Input: nums = [1,3,7,15]
Output: [3,7,15]
```

**Example 2:**

```
Input: nums = [8,4,2]
Output: [12,6]
```

**Example 3:**

```
Input: nums = [5,4,9,11]
Output: [5,13,11]
```

**Constraints:**

- `2 <= len(nums) <= 100`
- `0 <= nums[i] <= 100`
"""
