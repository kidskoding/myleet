id = "maximum-distance-between-unequal-words-in-array-i"
title = "Maximum Distance Between Unequal Words in Array I"
difficulty = "easy"
leetcode = 3696
url = "https://leetcode.com/problems/maximum-distance-between-unequal-words-in-array-i/"
key_idea = "An optimal pair always uses the first or the last word, so compare every word against both ends and keep the widest unequal span."
hints = ["If words[i] differs from words[j], it must differ from at least one of the two ends.", "Widening a valid pair toward an end can only help if the end differs too."]
prompt = """
Implement `max_distance(words)`. For two indices `i < j` with `words[i] != words[j]`, the
distance between them is `j - i + 1`. Return the largest such distance, or `0` if every
word in the list is the same.

**Example 1:**

```
Input: words = ["leetcode","leetcode","codeforces"]
Output: 3
```

Indices `0` and `2` hold different words, giving `2 - 0 + 1 = 3`.

**Example 2:**

```
Input: words = ["a","b","c","a","a"]
Output: 4
```

Indices `1` and `4` differ (`"b"` and `"a"`), giving `4`. The two ends are both `"a"`, so
the full span does not count.

**Example 3:**

```
Input: words = ["z","z","z"]
Output: 0
```

**Constraints:**

- `1 <= words.length <= 100`
- `1 <= words[i].length <= 10`
- `words[i]` consists of lowercase English letters
"""
