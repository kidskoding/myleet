id = "minimum-cost-to-equalize-array"
title = "Minimum Cost to Equalize Array"
difficulty = "hard"
leetcode = 3139
url = "https://leetcode.com/problems/minimum-cost-to-equalize-array/"
key_idea = "For each target from max to 2*max, the deficits have total S and largest M; pair ops cover min(S // 2, S - M) units and the rest use single ops, unless a pair costs at least two singles."
hints = ["If cost2 >= 2 * cost1, pairing never helps.", "Pairing is limited when one element's deficit dominates the rest; raising the target slightly can unlock more pairs."]
