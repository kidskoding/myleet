id = "subsequence-of-size-k-with-the-largest-even-sum"
title = "Subsequence of Size K With the Largest Even Sum"
difficulty = "medium"
leetcode = 2098
url = "https://leetcode.com/problems/subsequence-of-size-k-with-the-largest-even-sum/"
key_idea = "Take the k largest; if their sum is odd, fix parity with the better of two swaps: drop the smallest chosen odd for the largest unchosen even, or drop the smallest chosen even for the largest unchosen odd."
hints = ["Start from the k largest values; when is that already the answer?", "If the sum is odd you must change exactly one parity; consider swapping one chosen element for one unchosen element of the other parity."]
prompt = """
Implement `largest_even_sum(nums, k)`. Choose exactly `k` elements of `nums` (a
subsequence of length `k`; order does not matter for the sum) so that their sum is even and
as large as possible. Return that sum, or `-1` if no choice of `k` elements has an even sum.

**Example 1:**

```
Input: nums = [4,1,5,3,1], k = 3
Output: 12
```

Choosing `4`, `5` and `3` gives `12`, which is even.

**Example 2:**

```
Input: nums = [4,6,2], k = 3
Output: 12
```

**Example 3:**

```
Input: nums = [1,3,5], k = 1
Output: -1
```

Every single element is odd.

**Constraints:**

- `1 <= nums.length <= 10^5`
- `0 <= nums[i] <= 10^5`
- `1 <= k <= nums.length`
"""
