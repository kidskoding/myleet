id = "count-strictly-increasing-subarrays"
title = "Count Strictly Increasing Subarrays"
difficulty = "medium"
leetcode = 2393
url = "https://leetcode.com/problems/count-strictly-increasing-subarrays/"
key_idea = "Track the length of the strictly increasing run ending at each index; each index adds that length to the answer."
hints = ["A subarray is strictly increasing iff every adjacent pair inside it increases.", "How many valid subarrays end at index i, given the run length ending at i - 1?"]
prompt = """
Implement `count_subarrays(nums)`, which returns how many non-empty contiguous subarrays
of `nums` are strictly increasing (every element is larger than the one before it). A
single element always counts.

**Example 1:**

```
Input: nums = [1,3,5,4,4,6]
Output: 10
```

The strictly increasing subarrays are the six single elements, `[1,3]`, `[3,5]`,
`[1,3,5]` and `[4,6]`.

**Example 2:**

```
Input: nums = [1,2,3,4,5]
Output: 15
```

Every subarray is strictly increasing.

**Constraints:**

- `1 <= nums.length <= 10^5`
- `1 <= nums[i] <= 10^6`
"""
