id = "paint-house-ii"
title = "Paint House II"
difficulty = "hard"
leetcode = 265
url = "https://leetcode.com/problems/paint-house-ii/"
key_idea = "Paint House DP with k colors in O(nk): track the smallest and second-smallest previous totals so each color adds the best total that used a different color."
hints = ["The 3-color DP takes min over the other colors. With k colors that min is O(k) per cell. What single fact about the previous row would make it O(1)?", "Remember the minimum and second minimum of the previous row (and which color gave the minimum); a color equal to that one uses the second minimum."]
prompt = """
Write `min_cost_ii(costs)`. A row of `n` houses must each be painted one of `k` colors, and no
two neighboring houses may share a color. `costs[i][j]` is the price of painting house `i` with
color `j`.

Return the minimum total price to paint every house. An empty row costs 0.

**Example 1:**

```
Input: costs = [[1,5,3],[2,9,4]]
Output: 5
```

Paint house 0 with color 0 and house 1 with color 2 (1 + 4), or color 2 then color 0 (3 + 2).

**Example 2:**

```
Input: costs = [[1,3],[2,4]]
Output: 5
```

**Example 3:**

```
Input: costs = [[1,2,3],[1,2,3],[1,2,3]]
Output: 4
```

**Constraints:**

- `0 <= n <= 100`
- `1 <= k <= 20`, and `k >= 2` whenever `n >= 2`
- `1 <= costs[i][j] <= 20`
"""
