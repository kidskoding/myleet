key_idea = "Bucket 0..5000 by digit sum; DP over positions where dp[v] counts arrays ending in v, and a two-pointer prefix sum over the previous bucket gives each new value's count."
hints = ["Each position can only hold values from one small, fixed set determined by its digit sum.", "dp over (position, chosen value): the count for value v is the sum of previous counts for values <= v, which a running prefix sum supplies."]
