id = "minimum-spanning-tree-cost"
title = "Minimum Spanning Tree Cost"
difficulty = "medium"
key_idea = "Kruskal: sort edges by weight and union-find until one component remains."
hints = [
  "You want a spanning tree of minimum total weight.",
  "Sort candidate edges ascending and add one only when it connects different components.",
  "If you never reach a single component, the graph is disconnected — return -1.",
]
prompt = """
You are given `n` nodes labeled `0` through `n - 1` and an undirected weighted edge list
`edges`, where each `edges[i] = [u, v, w]` connects `u` and `v` with weight `w`.

Implement `mst_cost(n, edges)` that returns the total weight of a minimum spanning tree
of the graph, or `-1` if the graph is not connected. If `n == 1`, return `0`.

**Example 1:**

```
Input: n = 4, edges = [[0,1,1],[1,2,2],[0,2,3],[2,3,4]]
Output: 7
```

Edges `(0,1)`, `(1,2)`, and `(2,3)` form an MST of weight `1 + 2 + 4 = 7`.

**Example 2:**

```
Input: n = 3, edges = [[0,1,5]]
Output: -1
```

Node `2` is unreachable.

**Example 3:**

```
Input: n = 1, edges = []
Output: 0
```

**Constraints:**

- `1 <= n <= 10^4`
- `0 <= edges.length <= 10^4`
- `0 <= u, v < n`, `u != v`
- `1 <= w <= 10^6`
"""
