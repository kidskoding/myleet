id = "minimum-cost-to-connect-sticks"
title = "Minimum Cost to Connect Sticks"
difficulty = "medium"
leetcode = 1167
url = "https://leetcode.com/problems/minimum-cost-to-connect-sticks/"
key_idea = "min-heap greedy repeatedly merging the two smallest."
hints = []
prompt = """
You are given an array `sticks` of positive integer lengths. You may join any two sticks of lengths
`x` and `y` into a single stick of length `x + y`, and doing so costs `x + y`. You keep joining
sticks until exactly one stick remains.

Implement `connect_sticks(sticks)` and return the minimum total cost to end with one stick. If there
is only one stick to begin with, the cost is `0`.

**Example 1:**

```
Input: sticks = [2,4,3]
Output: 14
```

Join `2` and `3` for a cost of `5`, leaving `[5,4]`; then join `5` and `4` for a cost of `9`. Total `14`.

**Example 2:**

```
Input: sticks = [1,8,3,5]
Output: 30
```

**Example 3:**

```
Input: sticks = [5]
Output: 0
```

**Constraints:**

- `1 <= sticks.length <= 10^4`
- `1 <= sticks[i] <= 10^4`
"""
