id = "meeting-rooms"
title = "Meeting Rooms"
difficulty = "easy"
leetcode = 252
url = "https://leetcode.com/problems/meeting-rooms/"
key_idea = "sort by start, check every adjacent pair for overlap."
hints = []
prompt = """
You are given a list of meetings `intervals`, where `intervals[i] = [start_i, end_i]` means a meeting
runs from time `start_i` up to (but not including) time `end_i`.

Implement `can_attend_meetings(intervals)` and return `True` if one person could attend every
meeting, meaning no two meetings overlap, and `False` otherwise. A meeting that starts exactly when
another ends does not overlap it. An empty list of meetings returns `True`.

**Example 1:**

```
Input: intervals = [[0,30],[5,10],[15,20]]
Output: False
```

`[0,30]` overlaps both of the other meetings.

**Example 2:**

```
Input: intervals = [[7,10],[2,4]]
Output: True
```

**Example 3:**

```
Input: intervals = []
Output: True
```

**Constraints:**

- `0 <= intervals.length <= 10^4`
- `0 <= start_i < end_i <= 10^6`
"""
