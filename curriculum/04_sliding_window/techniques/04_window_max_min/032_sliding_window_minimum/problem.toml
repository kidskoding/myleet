id = "sliding-window-minimum"
title = "Sliding Window Minimum"
difficulty = "medium"
key_idea = "mirror of the maximum; a monotonic increasing deque of indices gives each window min."
hints = []
prompt = """
Write `min_sliding_window(nums, k)`. A window of width `k` starts at the left end of the
integer array `nums` and moves one position to the right at a time until it reaches the
right end. Return a list containing the smallest value inside the window at each position,
in order from left to right.

The result has `nums.length - k + 1` entries.

**Example 1:**

```
Input: nums = [1,3,-1,-3,5,3,6,7], k = 3
Output: [-1,-3,-3,-3,3,3]
```

The windows are `[1,3,-1]`, `[3,-1,-3]`, `[-1,-3,5]`, `[-3,5,3]`, `[5,3,6]`, and `[3,6,7]`.

**Example 2:**

```
Input: nums = [4,3,2,1], k = 2
Output: [3,2,1]
```

**Example 3:**

```
Input: nums = [5], k = 1
Output: [5]
```

**Constraints:**

- `1 <= nums.length <= 10^5`
- `-10^4 <= nums[i] <= 10^4`
- `1 <= k <= nums.length`
"""
