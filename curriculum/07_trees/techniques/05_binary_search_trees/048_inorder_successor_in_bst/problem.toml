id = "inorder-successor-in-bst"
title = "Inorder Successor in BST"
difficulty = "medium"
leetcode = 285
url = "https://leetcode.com/problems/inorder-successor-in-bst/"
key_idea = "BST navigation tracking the deepest ancestor greater than the target."
hints = []
prompt = """
Write `inorder_successor(root, p)`. Given the `root` of a binary search tree and a node `p`
that is in the tree, return the node that comes immediately after `p` in an in-order
traversal, which is the node with the smallest value strictly greater than `p.val`.

Return `None` if `p` holds the largest value in the tree. All values in the tree are
distinct.

**Example 1:**

```
Input: root = [2,1,3], p = 1
Output: 2
```

The in-order sequence is `1, 2, 3`, so the node after `1` is `2`.

**Example 2:**

```
Input: root = [2,1,3], p = 3
Output: null
```

`3` is the largest value, so it has no successor.

**Constraints:**

- The number of nodes is in the range `[1, 10^4]`
- `-10^5 <= Node.val <= 10^5`
- All node values are unique
- `p` is a node in the tree
"""
