id = "number-of-connected-components-in-an-undirected-graph"
title = "Number of Connected Components in an Undirected Graph"
difficulty = "medium"
leetcode = 323
url = "https://leetcode.com/problems/number-of-connected-components-in-an-undirected-graph/"
key_idea = "count components with DFS/BFS."
hints = []
prompt = """
You are given `n` nodes labeled `0` through `n - 1` and a list `edges`, where `edges[i] = [a_i, b_i]`
is an undirected edge between nodes `a_i` and `b_i`.

Implement `count_components(n, edges)` and return the number of connected components in the graph.
A node with no edges is a component on its own.

**Example 1:**

```
Input: n = 5, edges = [[0,1],[1,2],[3,4]]
Output: 2
```

Nodes `0`, `1`, `2` form one component and nodes `3`, `4` form another.

**Example 2:**

```
Input: n = 3, edges = []
Output: 3
```

**Example 3:**

```
Input: n = 1, edges = []
Output: 1
```

**Constraints:**

- `1 <= n <= 2000`
- `0 <= edges.length <= 5000`
- `edges[i].length == 2`
- `0 <= a_i, b_i < n`, `a_i != b_i`
- No edge appears more than once
"""
