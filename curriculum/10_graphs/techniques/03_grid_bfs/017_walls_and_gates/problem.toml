url = "https://leetcode.com/problems/walls-and-gates/"
key_idea = "multi-source BFS to fill shortest distances from many starts."
hints = []
prompt = """
You are given an `m x n` grid `rooms`. Each cell holds one of three values:

- `-1` is a wall or obstacle.
- `0` is a gate.
- `2147483647` (that is, `2^31 - 1`) is an empty room.

Implement `walls_and_gates(rooms)`, which modifies `rooms` in place and returns nothing. Replace the
value of every empty room with the number of steps to its nearest gate, where one step moves to an
up, down, left, or right neighbor and walls cannot be entered. An empty room that cannot reach any
gate keeps the value `2147483647`. Walls and gates are left unchanged.

**Example 1:**

```
Input: rooms = [[2147483647,-1,0,2147483647],
                [2147483647,2147483647,2147483647,-1],
                [2147483647,-1,2147483647,-1],
                [0,-1,2147483647,2147483647]]
Output: [[3,-1,0,1],
         [2,2,1,-1],
         [1,-1,2,-1],
         [0,-1,3,4]]
```

**Example 2:**

```
Input: rooms = [[2147483647,2147483647],[2147483647,2147483647]]
Output: [[2147483647,2147483647],[2147483647,2147483647]]
```

There are no gates, so no room changes.

**Constraints:**

- `m == rooms.length`, `n == rooms[i].length`
- `1 <= m, n <= 250`
- `rooms[i][j]` is `-1`, `0`, or `2^31 - 1`
"""
