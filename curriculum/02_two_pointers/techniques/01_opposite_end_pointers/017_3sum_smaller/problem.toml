id = "3sum-smaller"
title = "3Sum Smaller"
difficulty = "medium"
leetcode = 259
url = "https://leetcode.com/problems/3sum-smaller/"
key_idea = "fix one value, then count all pairs at once when the opposite-end sum drops below the target."
hints = []
prompt = """
Write `three_sum_smaller(nums, target)`. Given an integer array `nums` and an integer
`target`, return how many index triples `(i, j, k)` with `0 <= i < j < k < nums.length`
satisfy `nums[i] + nums[j] + nums[k] < target`.

Triples are counted by position, so equal values at different indices count separately.
If the array has fewer than three elements, return `0`.

**Example 1:**

```
Input: nums = [-2,0,1,3], target = 2
Output: 2
```

The qualifying triples are `[-2,0,1]` (sum -1) and `[-2,0,3]` (sum 1).

**Example 2:**

```
Input: nums = [], target = 0
Output: 0
```

**Example 3:**

```
Input: nums = [0], target = 0
Output: 0
```

**Constraints:**

- `0 <= nums.length <= 3500`
- `-100 <= nums[i] <= 100`
- `-100 <= target <= 100`
"""
