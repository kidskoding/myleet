version: 2

project_name: myleet

before:
  hooks:
    - go mod tidy

builds:
  - id: myleet
    main: ./cmd/myleet
    binary: myleet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/kidskoding/myleet/internal/version.Version={{.Version}}
      - -X github.com/kidskoding/myleet/internal/version.Commit={{.ShortCommit}}
      - -X github.com/kidskoding/myleet/internal/version.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: kidskoding
    name: myleet
  draft: false
  prerelease: auto
