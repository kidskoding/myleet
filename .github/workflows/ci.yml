name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync development environment
        run: uv sync --group dev

      - name: Check Rust code
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Check curriculum
        run: |
          cargo run --release -- validate
          cargo run --release -- check --solutions

      - name: Check Python style
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check types
        run: uv run ty check

      - name: Run Python tests
        run: uv run pytest

      - name: Check Markdown formatting
        run: find . -path './.git' -prune -o -path './.venv' -prune -o -path './.pytest_cache' -prune -o -path './target' -prune -o -name '*.md' -type f -print | xargs -r uv run mdformat --check
