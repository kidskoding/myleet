name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            worker -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync development environment
        run: uv sync --group dev

      - name: Check Rust code
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Check the core and bindings build for the browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p myleet-core -p myleet-wasm --target wasm32-unknown-unknown

      - name: Check the Worker backend
        run: |
          cargo fmt --check --manifest-path worker/Cargo.toml
          cargo clippy --manifest-path worker/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo test --manifest-path worker/Cargo.toml

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install just and wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack

      - name: Build the web app
        run: just web-build

      - name: Test the web app
        working-directory: web
        run: bun run test

      - name: Check curriculum
        run: |
          cargo run --release -- validate
          cargo run --release -- check --solutions

      - name: Check Python style
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check types
        run: uv run ty check

      - name: Run Python tests
        run: uv run pytest

      - name: Check Markdown formatting
        run: find . -path './.git' -prune -o -path './.venv' -prune -o -path './.pytest_cache' -prune -o -path './target' -prune -o -path '*/node_modules' -prune -o -path './worker/target' -prune -o -path './web/dist' -prune -o -path './web/src/wasm' -prune -o -path './web/public/data' -prune -o -name '*.md' -type f -print | xargs -r uv run mdformat --check
