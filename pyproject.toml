[project]
name = "myleet"
version = "0.1.0"
description = "dsa prep in Python for internship, co-op, and new-grad interviews at big tech companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-frontmatter>=2.0.8",
    "mdformat-gfm>=0.4.1",
    "ruff>=0.11.13",
    "ty>=0.0.1a1",
]

[tool.mdformat]
wrap = 88

[tool.pytest.ini_options]
pythonpath = ["curriculum/_lib"]
testpaths = ["tools", "curriculum"]
norecursedirs = ["techniques", ".venv", ".git", "fixtures"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["internal/*/testdata"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
extra-paths = ["curriculum/_lib"]

[tool.ty.src]
exclude = ["curriculum/**/techniques/**", "bank/**", "tools/migrate/tests/fixtures/**", "internal/**/testdata/**"]

[tool.ty.rules]
empty-body = "ignore"

[[tool.ty.overrides]]
include = ["**/tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
