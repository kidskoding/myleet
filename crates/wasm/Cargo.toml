[package]
name = "myleet-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "wasm-bindgen API over myleet-core for the web app"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jiff.workspace = true
myleet-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.100"

# Browser backends: crypto.getRandomValues for attempt ids, Intl for the system time zone.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
jiff = { workspace = true, features = ["js"] }
